<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="addons/addons.js" defer></script>

    <link rel="stylesheet" href="styles.css">

    <title>Document</title>
</head>
<body>

    <div class ="desktop">

        <img src="images/rolling-hills.jpg">

        <div class="desktop-space">

            <div class="desktop-icon" data-id="firefox">
                <img src="images/Mozilla_Firefox_logo_2004.webp" alt="Firefox">
                <span>Internet</span>
            </div>

            <div class="desktop-icon" data-id="recycle-bin">
                <img src="images/recycle-bin.png" alt="Recycle Bin">
                <span>Bin</span>
            </div>

            <div class="desktop-icon" data-id="purble-place">
                <img src="images/purble-place.png" alt="Purble Place">
                <span>Purble Place</span>
            </div>

        </div>
        
        <div class="taskbar">
            <div class="taskbar-btn" onclick="startMenu()">
                <image src="images/Windows_7-Logo.wine.png">
            </div>

        </div>


<div id="start-menu" class="start-menu">

    <div class="start-left">
        <button onclick="openApp('firefox')">
            <image src="images/Mozilla_Firefox_logo_2004.webp"></image> Internet
        </button>

        <button onclick="openApp('purble-place')">
            <image src="images/purble-place.png"></image> Purble Place
        </button>

        <button onclick="">
            <image src="images/music-player.png"></image> Media Player
        </button>


    </div>

    <div class="start-right">

        <button onclick="openApp('documents')">
            📁 Documents
        </button>

        <button onclick="openApp('control-panel')">
            ⚙️ Control Panel
        </button>
    </div>

    <div class="start-bottom">
        <div class="search-box">
            <input type="text" placeholder="Search programs and files...">
        </div>

        <button onclick="shutDown()">
            Shut down
        </button>
    </div>

</div>

    </div>

</body>
</html>


<script src="index.js">

</script>
