<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clippy Test Desktop</title>
  <link rel="stylesheet" href="clippy.css">
  <style>
    html, body { height: 100%; margin: 0; overflow: hidden; font: 13px "Segoe UI", Tahoma, sans-serif; }
    body { background: linear-gradient(160deg, #0b3d91, #1f74c9 45%, #5bb5f0); transition: background 0.4s; }

    .note { position: absolute; top: 16px; left: 16px; max-width: 360px; padding: 10px 12px; border-radius: 6px; background: rgba(255, 255, 255, 0.88); }
    .note p { margin: 4px 0 0; }

    .taskbar {
      position: fixed; left: 0; right: 0; bottom: 0; height: 40px;
      display: flex; align-items: center; gap: 4px; padding: 0 6px;
      background: linear-gradient(rgba(60, 90, 120, 0.8), rgba(20, 40, 60, 0.9));
      border-top: 1px solid rgba(255, 255, 255, 0.35);
    }
    .taskbar button {
      height: 32px; padding: 0 12px; border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 4px;
      background: rgba(255, 255, 255, 0.12); color: #fff; font: inherit; cursor: pointer;
    }
    .taskbar button:hover { background: rgba(255, 255, 255, 0.25); }
    .taskbar .tray { margin-left: auto; }

    .win {
      position: absolute; width: 360px; padding: 0 7px 7px; border: 1px solid rgba(0, 0, 0, 0.45); border-radius: 7px;
      background: rgba(170, 200, 230, 0.75); box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }
    .win header { display: flex; align-items: center; height: 28px; text-shadow: 0 0 8px #fff; }
    .win header button {
      margin-left: auto; width: 40px; height: 18px; border: 1px solid #6b1c12; border-radius: 3px;
      background: linear-gradient(#e8a493, #c7442b 50%, #b0260c); color: #fff; font-weight: bold; cursor: pointer;
    }
    .win .body { min-height: 150px; padding: 8px; border: 1px solid rgba(0, 0, 0, 0.4); background: #fff; }
    .win textarea { box-sizing: border-box; width: 100%; height: 180px; border: 0; outline: none; resize: none; font: 13px Consolas, monospace; }
  </style>
</head>
<body>
  <div class="note">
    <strong>Clippy test desktop</strong>
    <p>A stand-in for the real OS so Clippy can be tested on its own. Open apps from the taskbar, type "Dear Sam," in Notepad, or click Clippy (or press F1) to chat.</p>
  </div>

  <div class="taskbar">
    <button data-open="forum">FunForum</button>
    <button data-open="notepad">Notepad</button>
    <button data-open="browser">Internet Explorer</button>
    <button data-open="computer">My Computer</button>
    <button class="tray" id="clippy-button">Clippy</button>
  </div>

  <script src="clippy.js"></script>
  <script>
    // A tiny fake OS implementing the contract in README.md.
    const APPS = {
      forum: { title: 'FunForum', body: '<p>(The real forum opens in the browser. This is a stand-in.)</p>' },
      notepad: { title: 'Untitled - Notepad', body: '<textarea placeholder="Type here..."></textarea>' },
      browser: { title: 'Internet Explorer', body: '<p>The page cannot be displayed.</p>' },
      computer: { title: 'My Computer', body: '<p>Local Disk (C:)<br>DVD RW Drive (D:)</p>' },
    };
    const WALLPAPERS = [
      'linear-gradient(160deg, #0b3d91, #1f74c9 45%, #5bb5f0)',
      'linear-gradient(160deg, #1d5e2b, #58a845 50%, #a6dd7a)',
      'linear-gradient(160deg, #3a1452, #8e3fa8 50%, #f07ac0)',
      'linear-gradient(160deg, #5a2d0c, #d9822b 50%, #ffd27a)',
    ];
    let z = 10, cascade = 0, wallpaper = 0;

    window.OS = {
      openApp(id) {
        const existing = document.querySelector(`[data-app-window="${id}"]`);
        if (existing) { existing.style.zIndex = ++z; return; }
        const app = APPS[id];
        if (!app) return;
        const win = document.createElement('section');
        win.className = 'win';
        win.dataset.appWindow = id;
        win.style.left = 420 + cascade * 40 + 'px';
        win.style.top = 40 + cascade * 30 + 'px';
        win.style.zIndex = ++z;
        cascade = (cascade + 1) % 5;
        win.innerHTML = `<header><span>${app.title}</span><button title="Close">x</button></header><div class="body">${app.body}</div>`;
        win.querySelector('header button').onclick = () => OS.closeApp(id);
        win.addEventListener('pointerdown', () => { win.style.zIndex = ++z; });
        document.body.appendChild(win);
      },
      closeApp(id) {
        document.querySelectorAll(`[data-app-window="${id}"]`).forEach(w => w.remove());
      },
      setWallpaper() {
        wallpaper = (wallpaper + 1) % WALLPAPERS.length;
        document.body.style.background = WALLPAPERS[wallpaper];
      },
    };

    document.querySelectorAll('[data-open]').forEach(b => { b.onclick = () => OS.openApp(b.dataset.open); });
    document.getElementById('clippy-button').onclick = () => Clippy.open();


    Clippy.init();
  </script>
</body>
</html>
