<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <title>YouTube - Broadcast Yourself</title>
  <style>
    body { margin: 0; font: 12px Arial, Helvetica, sans-serif; color: #000; background: #fff; }
    a { color: #03c; cursor: pointer; }
    .page { max-width: 960px; margin: 0 auto; padding: 0 12px 24px; }

    header { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; padding: 12px 0 8px; }
    .logo { display: block; width: 123px; height: 63px; cursor: pointer; }
    .top-right { text-align: right; }
    .links { margin-bottom: 8px; color: #999; }
    form { display: flex; gap: 4px; justify-content: flex-end; }
    form input { width: 260px; padding: 3px; border: 1px solid #999; font: 13px Arial, sans-serif; }
    form button { padding: 2px 10px; border: 1px solid #999; border-radius: 3px; background: linear-gradient(#fff, #ddd); font: bold 12px Arial, sans-serif; cursor: pointer; }

    nav { display: flex; gap: 4px; padding-left: 160px; border-bottom: 4px solid #ddd; }
    nav span { padding: 6px 22px; border: 1px solid #aac; border-bottom: 0; border-radius: 6px 6px 0 0;
      background: linear-gradient(#e6eefc, #bccdf0); font: bold 13px Arial, sans-serif; color: #036; cursor: pointer; }
    nav span.on { background: linear-gradient(#fff, #eee); color: #000; }

    .bar { margin: 14px 0 8px; padding: 5px 8px; border: 1px solid #ccc; border-radius: 4px; background: linear-gradient(#f7f7f7, #e3e3e3); font: bold 14px Arial, sans-serif; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px 12px; }
    .card { cursor: pointer; }
    .thumb { display: block; width: 130px; height: 97px; padding: 2px; border: 1px solid #999; background: #000; object-fit: cover; }
    .card .title { display: block; margin-top: 4px; font-weight: bold; }
    .from { color: #666; }

    .watch { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 18px; margin-top: 12px; }
    h1 { margin: 0 0 8px; font: bold 20px Arial, sans-serif; }
    .player { position: relative; width: 100%; max-width: 640px; aspect-ratio: 4 / 3; background: #000; border: 1px solid #000; }
    .player iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    .offline { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; gap: 10px;
      padding: 24px; color: #fff; background: radial-gradient(circle at 50% 40%, #333, #000); font-size: 13px; line-height: 1.5; }
    .offline b { font-size: 16px; }
    .offline button { align-self: flex-start; padding: 6px 14px; border: 1px solid #900; border-radius: 3px; cursor: pointer;
      background: linear-gradient(#ff5a4f, #cc1100); color: #fff; font: bold 13px Arial, sans-serif; }
    .offline code { color: #fc6; }
    .rate { display: flex; gap: 16px; margin-top: 8px; padding: 8px; border: 1px solid #ccc; background: #f3f3f3; }
    .stars { color: #e00; font-size: 16px; letter-spacing: 1px; }
    .info { padding: 8px; border: 1px solid #ccc; background: #fff; line-height: 1.5; }
    .info input { width: 100%; box-sizing: border-box; font: 11px Arial, sans-serif; }
    .related { margin-top: 12px; border: 1px solid #ccc; }
    .related h2 { margin: 0; padding: 5px 8px; background: #666; color: #fff; font: bold 13px Arial, sans-serif; }
    .related .card { display: flex; gap: 8px; padding: 6px; border-bottom: 1px solid #eee; }
    .related .card:hover { background: #ffc; }
    .related .thumb { width: 90px; height: 67px; flex: none; }
    .note { padding: 10px; border: 1px solid #e3c96a; background: #fffbe6; }
    @media (max-width: 760px) {
      .watch { grid-template-columns: 1fr; }
      nav { padding-left: 0; }
      header { flex-wrap: wrap; }
    }
    footer { margin-top: 24px; padding-top: 8px; border-top: 1px solid #ccc; color: #666; text-align: center; font-size: 11px; }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <img class="logo" id="logo" src="../../images/youtube-2006-logo.gif" alt="YouTube - Broadcast Yourself">
      <div class="top-right">
        <div class="links"><a>Sign Up</a> | <a>My Account</a> | <a>History</a> | <a>Help</a> | <a>Log In</a></div>
        <form id="search">
          <input name="q" placeholder="Search, or paste a YouTube link" aria-label="Search videos">
          <button>Search</button>
        </form>
      </div>
    </header>
    <nav><span class="on" id="tab-videos">Videos</span><span>Categories</span><span>Channels</span><span>Community</span></nav>
    <main id="main"></main>
    <footer>A 2006-style YouTube for the HackNotts 26 OS. Videos play through YouTube's own player.</footer>
  </div>

  <script src="site.js"></script>
  <script>
    // Classic 2000s videos. All of these allow embedding (checked with YouTube's oEmbed lookup).
    const VIDEOS = [
      { id: 'jNQXAC9IVRw', title: 'Me at the zoo', author: 'jawed', about: 'The very first video ever uploaded to YouTube, back in 2005.' },
      { id: 'dMH0bHeiRNg', title: 'Evolution of Dance', author: 'Judson Laipply', about: 'Six minutes of dance history, from rock and roll onwards.' },
      { id: '_OBlgSz8sSM', title: 'Charlie bit my finger - again !', author: 'HDCYT', about: 'Brotherly love, with teeth.' },
      { id: 'J---aiyznGQ', title: 'Keyboard Cat! - THE ORIGINAL!', author: 'Keyboard Cat!', about: 'A cat. A keyboard. A legend.' },
      { id: 'EwTZ2xpQwpA', title: '"Chocolate Rain" Original Song by Tay Zonday', author: 'TayZonday', about: 'The song that took over the internet in 2007.' },
      { id: 'y8Kyi0WNg40', title: 'Dramatic Look', author: 'magnets99', about: 'Five seconds. Maximum drama. Better known as the Dramatic Chipmunk.' },
      { id: 'PQHPYelqr0E', title: 'Weezer - Pork and Beans', author: 'WeezerVEVO', about: 'A music video packed with the biggest YouTube stars of the day.' },
      { id: 'eRBOgtp0Hac', title: 'Peanut Butter Jelly Time', author: 'carfreak0801', about: 'A dancing banana. That is all you need to know.' },
      { id: 'dQw4w9WgXcQ', title: 'Rick Astley - Never Gonna Give You Up', author: 'Rick Astley', about: "The internet's favourite prank since 2007." },
      { id: 'txqiwrbYGrs', title: 'David After Dentist', author: 'booba1234', about: 'A very confused trip home from the dentist.' },
      { id: 'OQSNhk5ICTI', title: 'Double Rainbow', author: 'Yosemitebear62', about: 'One man, one rainbow (well, two), and a lot of feelings.' },
      { id: 'ZZ5LpwO-An4', title: 'HEYYEYAAEYAAAEYAEYAA', author: 'ProtoOfSnagem', about: 'He-Man sings. It is exactly as good as it sounds.' },
    ];

    const main = document.getElementById('main');
    const thumb = id => `https://i.ytimg.com/vi/${id}/hqdefault.jpg`;
    const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const known = id => VIDEOS.find(v => v.id === id);

    // A YouTube link or bare video id -> the 11-character id.
    function videoIdFrom(text) {
      const m = text.trim().match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/) || text.trim().match(/^([\w-]{11})$/);
      return m && m[1];
    }

    // YouTube's player refuses to play on pages opened as a file (it needs to know which website
    // it's on, and file pages don't say), so explain that instead of showing YouTube's "Error 153".
    function playerFor(id) {
      if (location.protocol === 'file:') {
        return `<div class="offline">
          <b>This video can't play here</b>
          <span>YouTube only plays videos when the OS is running from a local server, not opened as a file.
            Start it with <code>start.sh</code> (or <code>start.bat</code> on Windows) in the project folder.</span>
          <button type="button" onclick="window.open('https://www.youtube.com/watch?v=${esc(id)}', '_blank')">Watch on YouTube</button>
        </div>`;
      }
      return `<iframe src="https://www.youtube-nocookie.com/embed/${esc(id)}?autoplay=1&rel=0"
        allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen
        referrerpolicy="strict-origin-when-cross-origin" title="Video player"></iframe>`;
    }

    function card(v) {
      return `<div class="card" data-id="${esc(v.id)}">
        <img class="thumb" src="${thumb(v.id)}" alt="" loading="lazy">
        <div><a class="title">${esc(v.title)}</a><div class="from">From: ${esc(v.author)}</div></div>
      </div>`;
    }

    function showHome() {
      main.innerHTML = `<div class="bar">Featured Videos</div><div class="grid">${VIDEOS.map(card).join('')}</div>`;
    }

    function showResults(query) {
      const words = query.toLowerCase().split(/\s+/).filter(Boolean);
      const hits = VIDEOS.filter(v => words.every(w => (v.title + ' ' + v.author + ' ' + v.about).toLowerCase().includes(w)));
      main.innerHTML = `<div class="bar">Search results for "${esc(query)}"</div>` + (hits.length
        ? `<div class="grid">${hits.map(card).join('')}</div>`
        : `<p class="note">No videos found. Tip: paste any YouTube link into the search box to watch it here.</p>`);
    }

    async function showWatch(id) {
      const v = known(id) || { id, title: 'YouTube video', author: '...', about: '' };
      const others = VIDEOS.filter(o => o.id !== id);
      main.innerHTML = `<div class="watch">
        <div>
          <h1 id="title">${esc(v.title)}</h1>
          <div class="player">${playerFor(id)}</div>
          <div class="rate"><span>Rate this video: <span class="stars">&#9733;&#9733;&#9733;&#9733;&#9733;</span></span><a>Save to Favorites</a><a>Share Video</a></div>
        </div>
        <div>
          <div class="info">From: <a id="author">${esc(v.author)}</a><p id="about">${esc(v.about)}</p>
            URL <input readonly value="http://www.youtube.com/watch?v=${esc(id)}"></div>
          <div class="related"><h2>Related Videos</h2>${others.slice(0, 8).map(card).join('')}</div>
        </div>
      </div>`;
      if (!known(id)) {
        // Look up the title of a pasted video (YouTube's oEmbed needs no key).
        try {
          const res = await fetch(`https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${encodeURIComponent(id)}&format=json`);
          const info = await res.json();
          document.getElementById('title').textContent = info.title;
          document.getElementById('author').textContent = info.author_name;
          v.title = info.title;
          document.title = 'YouTube - ' + info.title;
          tellBrowser(document.title);
        } catch { /* keep the placeholder */ }
      }
    }

    // Routes live in the hash: "#watch?v=ID" or "#results?search_query=...", home otherwise.
    function render() {
      const hash = decodeURIComponent(location.hash.slice(1));
      const watch = hash.match(/^watch\?v=([\w-]{11})/);
      const search = hash.match(/^results\?search_query=(.*)$/);
      if (watch) showWatch(watch[1]);
      else if (search) showResults(search[1]);
      else showHome();
      const v = watch && known(watch[1]);
      document.title = v ? `YouTube - ${v.title}` : 'YouTube - Broadcast Yourself';
    }

    // Let the retro browser update its address bar and history.
    function tellBrowser(title) {
      const hash = location.hash.slice(1);
      parent.postMessage({ source: 'retrobrowser-page', action: 'visited', address: 'www.youtube.com' + (hash ? '/' + hash : ''), title: title || document.title }, '*');
    }

    function go(hash) {
      if (location.hash.slice(1) === hash) return;
      location.hash = hash;
    }

    window.addEventListener('hashchange', () => { render(); tellBrowser(); });

    document.addEventListener('click', e => {
      const c = e.target.closest('.card');
      if (c) go('watch?v=' + c.dataset.id);
      if (e.target.closest('#logo, #tab-videos')) go('');
    });

    document.getElementById('search').addEventListener('submit', e => {
      e.preventDefault();
      const q = e.target.q.value.trim();
      if (!q) return;
      const id = videoIdFrom(q);
      go(id ? 'watch?v=' + id : 'results?search_query=' + encodeURIComponent(q));
    });

    render();
  </script>
</body>
</html>
