<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Browser Test Desktop</title>
  <link rel="stylesheet" href="browser.css">
  <link rel="stylesheet" href="../clippy/clippy.css">
  <style>
    html, body { height: 100%; margin: 0; overflow: hidden; font: 13px "Segoe UI", Tahoma, sans-serif; }
    body { background: linear-gradient(160deg, #0b3d91, #1f74c9 45%, #5bb5f0); }

    .note { position: absolute; top: 16px; right: 16px; max-width: 320px; padding: 10px 12px; border-radius: 6px; background: rgba(255, 255, 255, 0.88); }
    .note p { margin: 4px 0 0; }

    .icon { position: absolute; top: 20px; left: 20px; width: 76px; padding: 4px; text-align: center; color: #fff; text-shadow: 0 1px 3px #000; cursor: pointer; border-radius: 3px; }
    .icon:hover { background: rgba(255, 255, 255, 0.2); }
    .icon img { width: 48px; height: 48px; object-fit: contain; }

    .taskbar {
      position: fixed; left: 0; right: 0; bottom: 0; height: 44px;
      display: flex; align-items: center; gap: 4px; padding: 0 6px;
      background: linear-gradient(rgba(60, 90, 120, 0.8), rgba(20, 40, 60, 0.9));
      border-top: 1px solid rgba(255, 255, 255, 0.35);
    }
    .taskbar-btn { width: 52px; height: 38px; border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 4px; background: rgba(255, 255, 255, 0.12); cursor: pointer; }
    .taskbar-btn:hover { background: rgba(255, 255, 255, 0.25); }
  </style>
</head>
<body>
  <div class="note">
    <strong>Browser test desktop</strong>
    <p>A stand-in for the real OS so the browser can be tested on its own. Double-click the icon to open it. Clippy is here too.</p>
  </div>

  <div class="icon" id="browser-icon">
    <img src="../images/Mozilla_Firefox_logo_2004.webp" alt="">
    <div>Mozilla Firefox</div>
  </div>

  <div class="taskbar"></div>

  <script src="../clippy/clippy.js"></script>
  <script>Clippy.init({ bottom: 60 });</script>
  <script src="browser.js"></script>
  <script>
    // base: '../' because this page lives in browser/, while site paths are written from the OS root.
    RetroBrowser.init({
      launcher: '#browser-icon',
      taskbar: '.taskbar',
      icon: '../images/Mozilla_Firefox_logo_2004.webp',
      bottom: 44,
      base: '../',
    });
  </script>
</body>
</html>
