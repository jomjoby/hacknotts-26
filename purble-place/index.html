<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Purble Place</title>
<style>html, body, #app { margin: 0; width: 100%; height: 100%; background: #1d1230; overflow: hidden; }</style>
</head>
<body>
<div id="app"></div>
<script type="module">
  // Standalone page: the whole browser tab is the game window.
  //   index.html?game=purble-pairs&level=advanced&seed=42&menubar=0&mute=1
  import { mount } from './src/index.js';
  const q = new URLSearchParams(location.search);
  window.app = mount(document.getElementById('app'), {
    startGame: q.get('game') || undefined,
    startLevel: q.get('level') || undefined,
    seed: q.has('seed') ? Number(q.get('seed')) : undefined,
    menubar: q.get('menubar') !== '0',
    sound: q.get('mute') !== '1',
    storageKey: q.get('key') || 'purble-place',
  });
</script>
</body>
</html>
